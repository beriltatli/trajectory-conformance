name: ci

on:
  push:
  pull_request:

# A newer push to the same branch supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests that need the OpenSky sample skip themselves; everything else runs.
      - run: python -m pytest -q
      # The whole pipeline, download excepted, on synthetic traffic.
      - run: make smoke PY=python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-figures
          path: |
            build/smoke/figures/
            build/smoke/multiday/figures/
