name: pages

# The public replay: synthetic traffic only (configs/demo.yaml), generated here from the code,
# never OpenSky data. Publishes sim/ with the generated sim/demo/ scene.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make demo PY=python
      # Nothing but the viewer, its public basemap and the synthetic scene goes out.
      - run: test ! -e sim/data && ls -R sim | head -50
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sim
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
