survey:
  day: "2022-06-20"
  hour: 14
  # Boxes of 5 deg lat x 7.5 deg lon, each centred on a major hub (km^2 differs with latitude).
  candidates:
    london:     {lat_min: 49.0, lat_max: 54.0, lon_min: -4.0,  lon_max: 3.5}
    amsterdam:  {lat_min: 49.8, lat_max: 54.8, lon_min: 1.0,   lon_max: 8.5}
    frankfurt:  {lat_min: 47.5, lat_max: 52.5, lon_min: 4.8,   lon_max: 12.3}
    paris:      {lat_min: 46.5, lat_max: 51.5, lon_min: -1.2,  lon_max: 6.3}
    zurich:     {lat_min: 45.0, lat_max: 50.0, lon_min: 4.8,   lon_max: 12.3}
    madrid:     {lat_min: 38.0, lat_max: 43.0, lon_min: -7.5,  lon_max: 0.0}
    new_york:   {lat_min: 38.5, lat_max: 43.5, lon_min: -77.5, lon_max: -70.0}
    chicago:    {lat_min: 39.5, lat_max: 44.5, lon_min: -91.6, lon_max: -84.1}
    atlanta:    {lat_min: 31.1, lat_max: 36.1, lon_min: -88.2, lon_max: -80.7}

# Chosen from results/phase1_region_survey.json (2022-06-20 14-15 UTC): best or tied-best coverage
# of the European boxes with >= 280 aircraft airborne (3.7% stale/late rows, 96.8% of flight time
# covered, 0.8% of update intervals > 15 s) at within 6% of London's traffic density. See DATA.md. Contains EDDF, EDDM, EDDL, EDDK, EDDS.
region:
  name: frankfurt
  bbox: {lat_min: 47.5, lat_max: 52.5, lon_min: 4.8, lon_max: 12.3}

sample:
  days: ["2022-06-20", "2022-06-27"]
  hours: [12, 13, 14, 15, 16, 17]

ingest:
  chunk_rows: 25000
  # Rows whose position is older than (max time seen - window) are emitted; a later row for an
  # already-emitted aircraft with an older lastposupdate is dropped as late.
  reorder_window_s: 30
  # Schafer 2014 (05_schafer_2014_opensky.pdf, sec. IV-C) and Strohmeier 2021
  # (06_strohmeier_2021_opensky_dataset.pdf, sec. 3.2) both end a flight 10 min after last contact.
  flight_split_gap_s: 600
  # The samples are 10 s snapshots (measured: every `time` is a multiple of 10, diffs all 10 s),
  # not the 1 Hz vectors the README describes. Consecutive genuine updates are therefore ~10 s
  # apart; above 15 s at least one snapshot carried a stale position, i.e. a coverage hole.
  # A gap is never an anomaly by itself.
  coverage_gap_s: 15
  # Silent-vs-contact classification needs several snapshots of evidence inside the gap.
  silence_min_gap_s: 60
  min_flight_updates: 30
  min_flight_duration_s: 300
  low_altitude_m: 1500
  fresh_contact_s: 2

phase:
  window_s: 60
  # 2.5 m/s ~ 500 ft/min; below it the aircraft is treated as level ("cruise").
  level_rate_mps: 2.5

baselines:
  fixed_threshold:
    # 1, 2, 5, 10 NM; 5 NM is the en-route radar separation minimum.
    cross_track_m: [1852, 3704, 9260, 18520]
  # Intervals longer than this are coverage holes and not counted as monitored flight time.
  max_coast_s: 60

# IMM of 04_genovese_2001_imm.pdf, method 5 (CV-CA-TURN), Table 1 switching matrix.
imm:
  models: [cv, ca, turn]
  # Genovese's Pi is per filter cycle (1 s and 4 s sensors there); here per 10 s snapshot and
  # raised to dt / cycle_s for other intervals.
  cycle_s: 10
  switching:
    - [0.90, 0.08, 0.02]
    - [0.15, 0.70, 0.15]
    - [0.04, 0.16, 0.80]
  # Plant noise spectral densities: cv in m^2/s^3, ca and turn in m^2/s^5 (p. 617).
  q: {cv: 0.05, ca: 0.5, turn: 0.05}
  # Set from results/phase2_measurement_noise.json (tune day only): robust sd of steady-flight
  # innovations, which bound measurement sd from above (they include prediction error):
  # cross-track 3.65 m, baro 2.90 m, velocity 0.58-0.61 m/s, vertical rate 0.34 m/s,
  # timestamp sqrt(along^2 - cross^2) / speed = 0.049 s.
  measurement_sd:
    position_m: 3.5
    # Baro altitude is reported in 25 ft steps: 7.62 m / sqrt(12).
    altitude_m: 2.2
    velocity_mps: 0.5
    vertical_rate_mps: 0.3
    # Error of lastposupdate as the position's valid time; enters R along the velocity.
    timestamp_s: 0.05
  # Not in Genovese. Rejects components no aircraft motion could produce (see track/imm.py Gate):
  # 9.8 m/s^2 horizontal is a 45 deg bank turn, beyond any airliner (25-30 deg) and still within
  # what light aircraft in the sample do; 5 m/s^2 vertical is 0.5 g.
  gate:
    sigma: 6.0
    horizontal_accel_mps2: 9.8
    vertical_accel_mps2: 5.0
    reset_after: 3
  init:
    acceleration_sd_mps2: 2.0
    velocity_sd_missing_mps: 150.0
  checks:
    nis_runs: 100
    nis_duration_s: 1800
    delay_runs: 100
    # Updates after a track starts that are left out of NIS statistics (initial transient).
    burn_in_updates: 5

# Measurement noise and filter parameters are checked against the first day only; the second day
# is reported separately as data the parameters were not looked at on.
evaluation:
  tune_days: ["2022-06-20"]
  test_days: ["2022-06-27"]
  # Fixed in phase 3, before any detector beyond the baselines existed (NOTES.md, phase 3).
  horizon_s: 600
  # Deviation at which conformance is violated, per injected dimension.
  # 1 NM lateral and longitudinal: RNAV 1 / RNP 1 containment, the PBN specifications for
  # continental en-route, departure, arrival and approach (03_nasa_tm2020 Table 2; PBN accuracy
  # applies laterally and longitudinally, 03 sec. 3.3.1). 300 ft vertical: the level-flight
  # out-of-conformance criterion cited in 03 sec. 5.1.6.
  significance: {lateral: 1852.0, vertical: 300.0, longitudinal: 1852.0}
  gradual_min_s: 120
  detection_target: 0.90
  alert_budget_per_flight_hour: 2.0
  median_lead_target_s: 30
  alerts_per_event_target: 1.5

injection:
  events:
    # Onsets need track before them (filter settled, reference matched) and room after them.
    min_prior_s: 300
    min_remaining_s: 300
  lateral:
    # Heading offset off the flown path, turned into at 1.5 deg/s
    # (01_reynolds_hansman_conformance_fault_detection.pdf Fig. 5.10; 10 deg is its flight test).
    magnitudes: [2, 5, 10, 20, 30]
    turn_rate_dps: 1.5
  vertical:
    # Vertical rate offset, ft/min, ramped in over ramp_s.
    magnitudes: [250, 500, 1000, 2000]
    ramp_s: 10
  longitudinal:
    # Speed offset, kt; 10 kt is the speed-adjustment tolerance (03_nasa_tm2020 glossary 124).
    magnitudes: [10, 20, 40]
    accel_mps2: 0.5

# Phase 4: reference paths per origin-destination pair, built on the tune day only.
reference:
  path: data/phase4_references.pkl
  # A flight endpoint below this baro altitude is at an airport (ingest.low_altitude_m).
  airport_altitude_m: 1500
  # Endpoints within link_km of each other (single linkage) form one airport; an endpoint is
  # assigned to the nearest airport within assign_km. 5 km keeps EDDF apart from its
  # neighbours; at 10-20 km single linkage chains the Rhine-Main airfields into one.
  airport_link_km: 5
  airport_assign_km: 10
  # An endpoint within gate_edge_km of the region boundary is where the flight crossed it;
  # gates are gate_width_km slots along each side.
  gate_edge_km: 30
  gate_width_km: 50
  # Fewer tune-day flights than this and the pair gets no reference (the count is reported).
  min_flights: 5
  shape_points: 100
  station_m: 2000
  # A station's norms pool fixes within +-station_window stations.
  station_window: 1
  # n0 in the shrinkage of a station's sd toward the path-wide sd.
  shrinkage_flights: 5
  eta_short_s: 120
  eta_long_s: 300
  # Calibration of each residual component's tail (conform/score.py TailTable).
  tail_points: 400
  tail_fraction: 0.01
  match:
    back_m: 5000
    ahead_m: 20000
    # Covers a coverage hole flown at up to 300 m/s, with margin.
    ahead_speed_mps: 450

# Alert management, the same for every detector in phase 4 (alerts/manage.py). Fixed from the
# phase 2 mode-switch delays and the 10 s cadence, not tuned on any evaluation output.
alerts:
  persist_updates: 2
  holdoff_s: 300
  represent_s: 300

# Peak RSS bound for the streaming chain, asserted by tests/test_memory_bound.py and checked
# against the full-sample run. Machine has 8 GB; the bound leaves room for everything else.
memory_bound_mb: 500

# Phase 5: per-flight adaptation of the residual offset (drift/adapt.py), fixed before any run.
drift:
  tails_path: data/phase5_tails.pkl
  # From one manoeuvre's length to well past the 600 s evaluation horizon; .inf is phase 4's
  # unadapted monitor and is not rerun.
  tau_s: [60, 120, 300, 600, 1800]
  # A row rarer than 1 in 100 held-out tune-day fixes (unadapted tails) does not update the offset.
  guard_score: 2.0
  # 03_nasa_tm2020 sec. 5.1.8: conformance range mu +- 1.96 sigma of conforming flights. A
  # flight may learn an offset anywhere inside the range normal traffic occupies, not beyond it.
  cap_sd: 2.0
